[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old Wix addresses that change on the new site
[[redirects]]
  from = "/copy-of-deli-menu"
  to = "/platters"
  status = 301

# The privacy policy is now a pop-up on the home page
[[redirects]]
  from = "/privacy"
  to = "/#privacy"
  status = 301
