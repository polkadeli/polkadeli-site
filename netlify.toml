[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"   # Astro needs 22.23.4 or newer

# Old Wix addresses that change on the new site
[[redirects]]
  from = "/copy-of-deli-menu"
  to = "/platters"
  status = 301

# The privacy policy is now a pop-up on the home page
[[redirects]]
  from = "/privacy"
  to = "/#privacy"
  status = 301

# About is now a section on the home page
[[redirects]]
  from = "/about"
  to = "/#about"
  status = 301

# The home page mockup became the real home page (2026-11-06)
[[redirects]]
  from = "/home-preview"
  to = "/"
  status = 301

[[redirects]]
  from = "/pl/home-preview"
  to = "/pl/"
  status = 301
