<?xml version="1.0" encoding="UTF-8"?>
<!-- Mushroom slice doodle, drawn to match the pierogi doodles (dark lines, turned white on the hero) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="#231f20" stroke-linecap="round" stroke-linejoin="round">
  <!-- cap, with the underside curling in at both ends -->
  <path stroke-width="5.5" d="M16 64 C 9.5 36, 33 12.5, 60 13 C 87 12.5, 111 36, 104.5 64 C 101.5 73, 89 74.5, 84 66.5 C 77.5 59.5, 42.5 59.5, 36 66.5 C 31 74.5, 18.5 73, 16 64 Z" />
  <!-- gill curls -->
  <path stroke-width="4.5" d="M29 60 C 25 55.5, 29.5 49, 35.5 51.5" />
  <path stroke-width="4.5" d="M91 60 C 95 55.5, 90.5 49, 84.5 51.5" />
  <!-- stem -->
  <path stroke-width="5.5" d="M44.5 65 C 45 81, 41 96, 38 106 Q 60 112.5 82.5 106 C 79.5 96, 75.5 81, 76 65" />
  <!-- line down the stem -->
  <path stroke-width="4.5" d="M54.5 77 C 53.5 86, 52.5 93, 52.5 99" />
  <!-- shine on the cap -->
  <path stroke-width="4.5" d="M35 34 C 40 28, 46 25, 52 24" />
</svg>
