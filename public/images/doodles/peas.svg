<?xml version="1.0" encoding="UTF-8"?>
<!-- Open pea pod doodle, drawn to match the pierogi doodles -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none" stroke="#231f20" stroke-linecap="round" stroke-linejoin="round">
  <!-- stem with a little curl -->
  <path stroke-width="5" d="M118 30 C 124 22, 130 16, 138 14" />
  <path stroke-width="4.5" d="M126 22 C 132 26, 138 24, 140 18" />
  <!-- pod -->
  <path stroke-width="5.5" d="M118 30 C 126 50, 116 84, 92 108 C 70 130, 40 142, 22 138 C 14 136, 14 128, 22 120 C 50 94, 84 58, 118 30 Z" />
  <!-- inner edge of the open pod -->
  <path stroke-width="4" d="M112 42 C 112 62, 100 86, 80 104 C 64 118, 44 128, 30 130" />
  <!-- peas -->
  <circle stroke-width="4.5" cx="98" cy="62" r="10" />
  <circle stroke-width="4.5" cx="82" cy="82" r="10.5" />
  <circle stroke-width="4.5" cx="62" cy="100" r="10.5" />
  <circle stroke-width="4.5" cx="42" cy="116" r="9.5" />
</svg>
